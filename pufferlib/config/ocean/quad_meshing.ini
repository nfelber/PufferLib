[base]
package = ocean
env_name = puffer_quad_meshing
# policy_name = Policy
policy_name = QuadMeshingPolicy
rnn_name = None

[vec]
num_envs = 8
num_workers = 8

[env]
num_envs = 1024

# boundary_files = ["./boundaries/square.json"]
boundary_files = ["./boundaries/dolphin.json"]
# boundary_files = ["./boundaries/asterisk3.json"]
# boundary_files = ["./boundaries/circle_32.json"]

# boundary_files = [
#   "./boundaries/square.json",
#   "./boundaries/dolphin.json",
#   "./boundaries/asterisk3.json",
#   "./boundaries/asterisk3_big.json",
#   "./boundaries/circle_32.json"
#   ]

observation_radius = 2
observe_remaining_area = False
observe_local_radius = True
n_neighbors = 3
n_sdf_samples = 2

action_radius = 2
# fixed_local_radius = 0.08
cartesian_actions = True
edge_mode = True

delayed_rewards = False
random_active_vertex = False

render_enabled = False
render_target_fps = 60

export_meshes = False
export_mesh_path = "./meshes/mesh_{episode}.obj"

[train]
total_timesteps = 200_000_000
update_epochs = 3
gamma = 0.997
gae_lambda = 0.95
# gae_lambda = 0.95
learning_rate = 1e-4
anneal_lr = True
min_lr_ratio = 0.1
# prio_alpha = 0.8
# prio_beta0 = 0.2
# vf_coef = 0.5
# vf_clip_coef = 0.1
# clip_coef = 0.1
# ent_coef = 0.005
bptt_horizon = 128
# batch_size = 262144
batch_size = 1048576
minibatch_size = 16384
max_minibatch_size = 65536
# batch_size = 8196
# minibatch_size = 512






