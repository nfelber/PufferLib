[base]
package = ocean
env_name = puffer_quad_meshing
policy_name = QuadMeshingPolicy
rnn_name = None

[vec]
num_envs = 8
num_workers = 8

[env]
num_envs = 256

# The folder containing the boundaries to load
# Optionally, a subset of those files can be selected with boundary_names (`[]`
# to use all)
boundary_folder = "./boundaries/train"
boundary_names = []
# boundary_folder = "./boundaries/test"
# boundary_names = ["dolphin.json"]

# Observation settings
# - observation_radius: Multiples of the local radius (target edge length) to use
#   for the observation-related local frame (e.g. SDF samples)
# - observe_remaining_area: Observe the ratio of unmeshed area
# - observe_local_radius (legacy): observe the current local radius length
# - observe_boundary_cost: observe the cost of the current boundary based on
#   heuristics about internal angles
# - n_neighbors: number of neighbors vertices to observe on each side of the
#   reference vertex
# - n_sdf_samples: number of SDF samples to observe along the bisector of the
#   internal angle at the reference vertex
observation_radius = 2
observe_remaining_area = True
observe_local_radius = False
observe_boundary_cost = True
n_neighbors = 3
n_sdf_samples = 1

# Action settings
# - action_radius: Multiples of the local radius (target edge length) to use
#   for the action-related local frame (e.g. max new vertex distance)
# - cartesian_actions: use a cartesian local frame instead of polar
# - edge_mode: uses the edge-reference mode (requires cartesian actions)
action_radius = 2
cartesian_actions = False
edge_mode = False

# Experimental settings
# - delayed_rewards: only give a terminal reward based on accumulated quad
#   quality
# - random_active_vertex: picks the active vertex at random
delayed_rewards = False
random_active_vertex = False

render_enabled = False
render_target_fps = 60

export_meshes = False
export_mesh_path = "./meshes/mesh_{episode}.obj"

[train]
total_timesteps = 100_000_000
gamma = 0.8
gae_lambda = 0.95
learning_rate = 3e-3
anneal_lr = True
min_lr_ratio = 0.1
ent_coef = 0.001
bptt_horizon = 64
batch_size = 262144
minibatch_size = 16384
max_minibatch_size = 65536

[sweep.env.observe_remaining_area]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.env.observe_boundary_cost]
distribution = int_uniform
min = 0
max = 1
scale = auto

