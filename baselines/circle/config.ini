[base]
package = ocean
env_name = puffer_quad_meshing
policy_name = QuadMeshingPolicy
rnn_name = None

[env]
boundary_files = ["./boundaries/circle_32.json"]

observation_radius = 3
observe_remaining_area = False
n_neighbors = 3
n_sdf_samples = 5

action_radius = 3
fixed_local_radius = 0.05
cartesian_actions = True
edge_mode = True

delayed_rewards = False
random_active_vertex = False
