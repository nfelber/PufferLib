[base]
package = ocean
env_name = quad_meshing

[vec]
total_agents = 256
num_buffers = 1
num_threads = 1

[torch]
network = QuadMeshingBoundaryNetwork
encoder = QuadMeshingBoundaryEncoder
decoder = QuadMeshingBoundaryDecoder

[policy]
pos_bands = 4
n_neighbors = 3
source_hidden_size = 128
target_hidden_size = 128
num_layers = 3

[env]
seed = 42

# Env settings
episode_max_length = 128
candidate_rings = 5
candidate_angles = 64
candidate_radius_min = 0.15
candidate_radius_max = 0.20
target_quad_area = 0.015625
boundary_mode = True
boundary_paths = [
  "./resources/quad_meshing/boundaries/square.json"
  ]

# Rewards
reward_invalid = -0.1

# Perf
max_degree = 24
grid_res = 16
grid_cell_size = 0.0625
# grid_cell_size = 0.03125
grid_cell_cap = 8
intersection_tol = 1e-3

# Rendering
render_target_fps = 12
render_width = 1200
render_height = 900
render_show_frontier = True
render_show_candidates = True
render_line_thickness = 2.0
render_point_radius = 4.0
render_candidate_radius = 3.0

[train]
seed = 42
total_timesteps = 1_000_000
learning_rate = 0.005
anneal_lr = True
min_lr_ratio = 0.1
gamma = 0.85
# gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1.0
ent_coef = 0.001
minibatch_size = 1024
horizon = 64
