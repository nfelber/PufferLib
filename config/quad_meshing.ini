# Rewards
reward_invalid = -0.1
reward_incomplete = -1.0

# Perf
max_frontier = 256
max_degree = 8
grid_res = 16
grid_cell_size = 0.0625
grid_cell_cap = 8
intersection_tol = 1e-3

# Rendering
render_target_fps = 144
render_width = 1200
render_height = 900
render_show_frontier = True
render_show_candidates = True
render_line_thickness = 2.0
render_point_radius = 4.0
render_candidate_radius = 3.0

[train]
seed = 42
total_timesteps = 100_000_000
learning_rate = 0.005
anneal_lr = True
min_lr_ratio = 0.1
gamma = 0.997
gae_lambda = 0.95
replay_ratio = 2.0
ent_coef = 0.001
minibatch_size = 1024
horizon = 64

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_runs = 200
downsample = 5
early_stop_quantile = 0.3

# sweep_only = frontier_node_hidden_size, frontier_edge_hidden_size, frontier_context_hidden_size, target_hidden_size, network_layers, pos_bands, frontier_init_node_ring_n_neighbors, frontier_se2_layers, frontier_perceiver_d_model, frontier_perceiver_num_latents, frontier_perceiver_layers, frontier_perceiver_mlp_ratio, total_timesteps, horizon, minibatch_size, learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, clip_coef, vf_clip_coef, vf_coef, max_grad_norm, beta1, eps, prio_alpha, prio_beta0
sweep_only = frontier_se2_layers, total_timesteps, horizon, minibatch_size, learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, clip_coef, vf_clip_coef, vf_coef, max_grad_norm, beta1, eps, prio_alpha, prio_beta0

[sweep.policy.frontier_node_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_edge_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_context_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.target_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.network_layers]
distribution = int_uniform
min = 2
max = 5
scale = auto

[sweep.policy.pos_bands]
distribution = int_uniform
min = 2
max = 6
scale = auto

[sweep.policy.frontier_init_node_ring_n_neighbors]
distribution = int_uniform
min = 1
max = 6
scale = auto

[sweep.policy.frontier_se2_layers]
distribution = int_uniform
min = 3
max = 6
scale = auto

[sweep.policy.frontier_perceiver_d_model]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_perceiver_num_latents]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.policy.frontier_perceiver_layers]
distribution = int_uniform
min = 2
max = 6
scale = auto

[sweep.policy.frontier_perceiver_mlp_ratio]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e8
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
max = 0.995
scale = auto
