[base]
package = ocean
env_name = quad_meshing

[vec]
total_agents = 256
num_buffers = 1
num_threads = 1

[torch]
network = QuadMeshingNetwork
encoder = QuadMeshingEncoder
decoder = QuadMeshingDecoder

[policy]
pos_bands = 4
frontier_node_hidden_size = 32
frontier_edge_hidden_size = 32
frontier_context_hidden_size = 32
target_hidden_size = 32
network_layers = 2

# frontier_pipeline = [ "init", "perceiver" ]
frontier_pipeline = [ "init", "se2" ]

frontier_init_node_position = False
frontier_init_node_ring = False
frontier_init_node_ring_n_neighbors = 3
frontier_init_edge_midpoint = False
frontier_init_edge_length = True
frontier_init_edge_target_length = True
frontier_init_edge_target_log_length = True
frontier_init_edge_relative_length = True
frontier_init_edge_direction = False
frontier_init_edge_flags = True

frontier_se2_layers = 3

frontier_perceiver_d_model = 128
frontier_perceiver_num_latents = 32
frontier_perceiver_layers = 4
frontier_perceiver_heads = 8
frontier_perceiver_mlp_ratio = 2
frontier_perceiver_dropout = 0.0
frontier_perceiver_decode_node = True
frontier_perceiver_decode_edge = False
frontier_perceiver_update_context = True

# target_pipeline = [ "init", "source_condition" ]
target_pipeline = [ "init", "se2" ]

target_init_ring_frame_pos = False
target_init_distance = True
target_init_target_length = True
target_init_target_log_length = True
target_init_relative_distance = True
target_init_boundary_flag = True

max_frontier = 256
max_degree = 8
max_candidates = 768

[env]
seed = 42

# Env settings
boundary_mode = False
episode_max_length_ratio = 1.5
candidate_rings = 10
candidate_angles = 64
target_edge_length_ratio = 1.0
candidate_radius_min_ratio = 0.5
candidate_radius_max_ratio = 2.0
# boundary_paths = [ "./resources/quad_meshing/boundaries/square.json" ]
# boundary_paths = [ "./resources/quad_meshing/boundaries/dolphin.json" ]

