[base]
package = ocean
env_name = quad_meshing

[vec]
total_agents = 256
num_buffers = 1
num_threads = 1

[torch]
network = QuadMeshingNetwork
encoder = QuadMeshingEncoder
decoder = QuadMeshingDecoder

[policy]
pos_bands = 4
frontier_node_hidden_size = 64
frontier_edge_hidden_size = 64
frontier_context_hidden_size = 64
target_hidden_size = 64
network_layers = 2

# frontier_pipeline = [ "init" ]
# frontier_pipeline = [ "init", "se2" ]
frontier_pipeline = [ "init", "painn" ]
# frontier_pipeline = [ "init", "perceiver" ]

frontier_init_node_position = False
frontier_init_node_ring = False
frontier_init_node_ring_n_neighbors = 3
frontier_init_edge_midpoint = False
frontier_init_edge_direction = False
frontier_init_edge_length = True
frontier_init_edge_target_length = True
frontier_init_edge_target_log_length = True
frontier_init_edge_relative_length = True
frontier_init_edge_face_incidence = True

frontier_se2_layers = 3

frontier_painn_layers = 3
frontier_painn_vector_channels = 16
frontier_painn_chiral = True

frontier_perceiver_d_model = 128
frontier_perceiver_num_latents = 32
frontier_perceiver_layers = 4
frontier_perceiver_heads = 8
frontier_perceiver_mlp_ratio = 2
frontier_perceiver_dropout = 0.0
frontier_perceiver_decode_node = True
frontier_perceiver_decode_edge = False
frontier_perceiver_update_context = True

# target_pipeline = [ "init", "source_condition" ]
# target_pipeline = [ "init", "se2" ]
# target_pipeline = [ "init", "painn" ]
target_pipeline = [ "init", "painn", "source_global_perceiver" ]

target_init_ring_frame_pos = False
target_init_distance = True
target_init_target_length = True
target_init_target_log_length = True
target_init_relative_distance = True
target_init_boundary_flag = True

target_global_perceiver_d_model = 64
target_global_perceiver_num_latents = 32
target_global_perceiver_layers = 4
target_global_perceiver_heads = 8
target_global_perceiver_mlp_ratio = 4
target_global_perceiver_dropout = 0.0
target_global_perceiver_residual_scale_init = 0.0

max_frontier = 256
max_degree = 8
max_candidates = 768

[env]
seed = 42

# Env settings
boundary_mode = False
episode_max_length_ratio = 1.5
candidate_rings = 10
candidate_angles = 64
target_edge_length_ratio = 1.0
candidate_radius_min_ratio = 0.5
candidate_radius_max_ratio = 2.0
shape_folder = "./resources/quad_meshing/shapes"
shape_names = [ "dolphin.qmshape" ]
# shape_names = []

# Rewards
reward_invalid = -0.05
reward_incomplete = -1.0
base_quad_reward = 0.0
potential_beta = 0.05
potential_gamma = 0.999
frontier_quality_weight = 1.0
frontier_size_pressure_weight = 1.0
degree_pressure_weight = 1.0
safe_frontier_size_ratio = 0.9
safe_degree_ratio = 0.7

# Perf
max_frontier = 256
max_degree = 8
grid_res = 16
grid_cell_size = 0.0625
grid_cell_cap = 8
intersection_tol = 1e-3

# Rendering
render_target_fps = 144
render_width = 1200
render_height = 900
render_show_frontier = True
render_show_candidates = True
render_show_cross_field = False
render_line_thickness = 2.0
render_point_radius = 4.0
render_candidate_radius = 3.0

# Eval
export_obj = False
export_obj_path = "mesh.obj"

[train]
seed = 42
total_timesteps = 2_000_000
learning_rate = 5e-3
anneal_lr = True
min_lr_ratio = 0.1
gamma = 0.999
gae_lambda = 0.95
replay_ratio = 1.0
ent_coef = 0.001
minibatch_size = 1024
horizon = 64

# learning_rate = 0.005
# ent_coef = 0.001
# vf_coef = 2000
# vf_clip_coef = 0.002

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_runs = 200
downsample = 5
early_stop_quantile = 0.3

# sweep_only = frontier_node_hidden_size, frontier_edge_hidden_size, frontier_context_hidden_size, target_hidden_size, network_layers, pos_bands, frontier_init_node_ring_n_neighbors, frontier_se2_layers, frontier_perceiver_d_model, frontier_perceiver_num_latents, frontier_perceiver_layers, frontier_perceiver_mlp_ratio, total_timesteps, horizon, minibatch_size, learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, clip_coef, vf_clip_coef, vf_coef, max_grad_norm, beta1, eps, prio_alpha, prio_beta0
sweep_only = frontier_se2_layers, total_timesteps, horizon, minibatch_size, learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, clip_coef, vf_clip_coef, vf_coef, max_grad_norm, beta1, eps, prio_alpha, prio_beta0

[sweep.policy.frontier_node_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_edge_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_context_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.target_hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.network_layers]
distribution = int_uniform
min = 2
max = 5
scale = auto

[sweep.policy.pos_bands]
distribution = int_uniform
min = 2
max = 6
scale = auto

[sweep.policy.frontier_init_node_ring_n_neighbors]
distribution = int_uniform
min = 1
max = 6
scale = auto

[sweep.policy.frontier_se2_layers]
distribution = int_uniform
min = 3
max = 6
scale = auto

[sweep.policy.frontier_perceiver_d_model]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.frontier_perceiver_num_latents]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.policy.frontier_perceiver_layers]
distribution = int_uniform
min = 2
max = 6
scale = auto

[sweep.policy.frontier_perceiver_mlp_ratio]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e8
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
max = 0.995
scale = auto
