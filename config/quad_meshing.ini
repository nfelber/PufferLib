[base]
package = ocean
env_name = quad_meshing

[vec]
total_agents = 4096

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[env]
seed = 12345
max_steps = 2048
obs_buffer_size = 50000
max_vertices = 256
max_edges = 512
max_frontier = 128
max_candidates = 64
max_boundary_points = 256

# Boundary shape
boundary_paths = [
  "./ocean/quad_meshing/boundaries/rat-18.json"
  ]

# Candidate generation (polar grid)
candidate_rings = 4
candidate_angles = 16
candidate_radius_min = 0.03
candidate_radius_max = 0.20

# Validity constraints
max_degree = 12

# Rewards
reward_step = -0.001
reward_edge = 0.01
reward_quad = 0.25
reward_complete = 2.0
reward_invalid = -0.05

# Rendering
render_target_fps = 60
render_width = 1200
render_height = 900
render_show_frontier = 1
render_show_candidates = 1
render_show_indices = 0
render_line_thickness = 2.0
render_point_radius = 4.0
render_candidate_radius = 3.0
