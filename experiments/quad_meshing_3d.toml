[batch]
env = "quad_meshing_3d"
project = "puffer4"
group = "quad_meshing_3d_experiments"
seeds = [1, 2, 3]
slowly = true
wandb = true

# These values override config/default.ini and then config/quad_meshing_3d.ini
# for every experiment in this file.
[defaults.train]
total_timesteps = 20_000_000
learning_rate = 1e-3

[[experiments]]
name = "baseline"

[[experiments]]
name = "no_perceiver"

[experiments.policy]
target_pipeline = [ "init", "painn" ]
